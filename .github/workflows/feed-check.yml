name: Feed check (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Scrape and test feeds
        run: |
          mkdir out && cd out
          curl -sL -A "Mozilla/5.0" https://toomuchracing.com/calendar/ -o page.html
          grep -oiE 'https?://(www|calendar)\.google\.com/calendar/ical/[^"<> ]+basic\.ics' page.html | sed 's/&amp;/\&/g' | awk '!s[$0]++' > urls.txt
          # also capture anchor text / headings near each URL for naming
          python3 - <<'PY'
          import re,html
          s=open('page.html',encoding='utf-8',errors='ignore').read()
          out=open('context.txt','w')
          for m in re.finditer(r'https?://(?:www|calendar)\.google\.com/calendar/ical/[^"<> ]+basic\.ics',s,re.I):
              pre=re.sub(r'<[^>]+>',' ',s[max(0,m.start()-1500):m.start()])
              pre=html.unescape(re.sub(r'\s+',' ',pre))[-300:]
              out.write(m.group(0)+'\t'+pre+'\n')
          PY
          n=0
          while read u; do
            n=$((n+1)); curl -sL -m 30 "$u" -o "feed$n.ics"
            name=$(grep -m1 '^X-WR-CALNAME' "feed$n.ics" | cut -d: -f2- | tr -d '\r')
            total=$(grep -c '^BEGIN:VEVENT' "feed$n.ics")
            future=$(grep -E '^DTSTART' "feed$n.ics" | grep -oE '[0-9]{8}' | awk -v t=$(date +%Y%m%d) '$1>=t' | wc -l)
            printf '%s\t%s\t%s\t%s\t%s\n' "$n" "$name" "$total" "$future" "$u" >> results.tsv
          done < urls.txt
          cat results.tsv
      - name: Save results to branch
        run: |
          cd out
          git init -q -b feed-check && git config user.name bot && git config user.email bot@example.com
          git add -A && git commit -qm results
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" feed-check
