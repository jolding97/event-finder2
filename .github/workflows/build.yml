name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk EventRadar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EventRadar-apk
          path: EventRadar.apk
      # Publishes the APK on the repo's Releases page so it can be downloaded straight to a phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EventRadar build ${{ github.run_number }}
          body: Download EventRadar.apk below and open it on your Android phone to install.
          files: EventRadar.apk
          make_latest: true
